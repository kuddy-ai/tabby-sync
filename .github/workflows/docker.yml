name: Docker

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  verify:
    name: Build and smoke test Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build image for verification
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          push: false
          platforms: linux/amd64
          tags: tabby-sync:smoke
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test health endpoint
        env:
          CONTAINER_NAME: tabby-sync-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          docker run -d \
            --name "$CONTAINER_NAME" \
            tabby-sync:smoke

          for _ in $(seq 1 30); do
            if docker exec "$CONTAINER_NAME" \
              wget -q -O /dev/null http://127.0.0.1:8080/healthz; then
              echo "Smoke test passed"
              exit 0
            fi
            sleep 1
          done

          echo "Smoke test failed: /healthz did not return HTTP 200" >&2
          docker logs "$CONTAINER_NAME" >&2
          exit 1

      - name: Remove smoke test container
        if: always()
        env:
          CONTAINER_NAME: tabby-sync-smoke-${{ github.run_id }}-${{ github.run_attempt }}
        run: docker rm --force --volumes "$CONTAINER_NAME" 2>/dev/null || true

  publish:
    name: Publish Docker image to GHCR
    if: github.event_name == 'release'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout released revision
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract release metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          flavor: |
            latest=false
          tags: |
            type=semver,pattern={{version}},value=${{ github.event.release.tag_name }}
            type=semver,pattern={{major}}.{{minor}},value=${{ github.event.release.tag_name }}
            type=raw,value=latest

      - name: Build and push released image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
