name: auto-merge-release-pr

on:
  pull_request:
    types:
      - opened
      - synchronize
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'github-actions[bot]' && startsWith(github.event.pull_request.title, 'chore(main): release')
    runs-on: ubuntu-latest
    steps:
      - uses: hmarr/auto-approve-action@v4

      - name: Merge release PR
        env:
          GH_TOKEN: ${{ github.token }}
        # Use --auto if branch protection with required checks is configured;
        # fall back to direct merge otherwise. This handles both setups.
        run: |
          gh pr merge ${{ github.event.pull_request.number }} --auto --squash --repo ${{ github.repository }} 2>/dev/null \
            || gh pr merge ${{ github.event.pull_request.number }} --squash --repo ${{ github.repository }}
