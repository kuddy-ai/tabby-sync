name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).number || '' }}
      release_created: ${{ steps.rp.outputs.release_created }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  auto-merge:
    needs: release-please
    # Only merge if there's a Release PR and no release was created in this run.
    # When release_created is true, it means this is the second run after the
    # PR was merged, and we should not attempt to merge again (avoid dead loop).
    if: needs.release-please.outputs.pr_number != '' && needs.release-please.outputs.release_created != 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Merge release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ needs.release-please.outputs.pr_number }} \
            --squash \
            --delete-branch \
            --repo ${{ github.repository }}

      - name: Re-trigger workflow to create tag and release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release-please.yml --ref main --repo ${{ github.repository }}