name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      pr_number: ${{ steps.rp.outputs.pr && fromJSON(steps.rp.outputs.pr).number || '' }}
    steps:
      - id: rp
        uses: googleapis/release-please-action@v4
        with:
          config-file: .github/release-please-config.json
          manifest-file: .github/release-please-manifest.json

  auto-merge:
    needs: release-please
    if: needs.release-please.outputs.pr_number != ''
    runs-on: ubuntu-latest
    steps:
      # No auto-approve step: GitHub forbids github-actions[bot] from
      # approving a PR it created itself. If the main branch has required
      # reviews, an operator must use a Personal Access Token instead;
      # this is a documented release-please-action limitation. With no
      # required reviews, the merge below works directly with GITHUB_TOKEN.
      - name: Merge release PR
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge ${{ needs.release-please.outputs.pr_number }} --auto --squash --repo ${{ github.repository }} \
            || gh pr merge ${{ needs.release-please.outputs.pr_number }} --squash --repo ${{ github.repository }}
