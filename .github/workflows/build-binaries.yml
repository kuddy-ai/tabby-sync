name: Build binaries

on:
  pull_request:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

env:
  GOFLAGS: -mod=readonly
  GOTOOLCHAIN: local

jobs:
  build:
    name: Build ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - goos: linux
            goarch: amd64
            output: tabby-sync-linux-amd64
          - goos: linux
            goarch: arm64
            output: tabby-sync-linux-arm64
          - goos: windows
            goarch: amd64
            output: tabby-sync-windows-amd64.exe
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Resolve build metadata
        id: metadata
        shell: bash
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          RELEASE_DATE: ${{ github.event.release.published_at }}
        run: |
          version=0.0.0-dev
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          if [[ "$GITHUB_EVENT_NAME" == "release" ]]; then
            version="$RELEASE_TAG"
            build_date="$RELEASE_DATE"
          fi

          {
            echo "version=$version"
            echo "commit=$GITHUB_SHA"
            echo "date=$build_date"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        env:
          CGO_ENABLED: "0"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          MODULE: github.com/kuddy-ai/tabby-sync
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_COMMIT: ${{ steps.metadata.outputs.commit }}
          BUILD_DATE: ${{ steps.metadata.outputs.date }}
        run: |
          go build -trimpath \
            -ldflags="-s -w \
            -X ${MODULE}/internal/version.Version=${BUILD_VERSION} \
            -X ${MODULE}/internal/version.Commit=${BUILD_COMMIT} \
            -X ${MODULE}/internal/version.Date=${BUILD_DATE}" \
            -o "dist/${{ matrix.output }}" ./cmd/tabby-sync

      - name: Verify build identity
        if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
        env:
          BUILD_VERSION: ${{ steps.metadata.outputs.version }}
          BUILD_COMMIT: ${{ steps.metadata.outputs.commit }}
        run: |
          output="$(./dist/${{ matrix.output }} version)"
          echo "$output"
          grep -F -- "$BUILD_VERSION" <<< "$output"
          grep -F -- "$BUILD_COMMIT" <<< "$output"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: tabby-sync-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/${{ matrix.output }}
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Attach binaries to GitHub Release
    if: github.event_name == 'release'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download built binaries
        uses: actions/download-artifact@v8
        with:
          pattern: tabby-sync-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        working-directory: dist
        run: |
          sha256sum \
            tabby-sync-linux-amd64 \
            tabby-sync-linux-arm64 \
            tabby-sync-windows-amd64.exe \
            > SHA256SUMS

      - name: Attach binaries to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          gh release upload "$RELEASE_TAG" \
            dist/tabby-sync-linux-amd64 \
            dist/tabby-sync-linux-arm64 \
            dist/tabby-sync-windows-amd64.exe \
            dist/SHA256SUMS \
            --clobber
