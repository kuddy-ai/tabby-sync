name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  security-baseline:
    name: Security baseline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Check line endings
        shell: bash
        run: |
          if git grep -I -n $'\r' -- . ':!*.bat' ':!*.cmd' ':!*.ps1'; then
            echo "CRLF line endings detected. Use LF except Windows scripts."
            exit 1
          fi

      - name: Check large files
        shell: bash
        run: |
          max=$((5 * 1024 * 1024))
          failed=0
          while IFS= read -r -d '' file; do
            size=$(wc -c < "$file")
            if [ "$size" -gt "$max" ]; then
              echo "Large file: $file ($size bytes)"
              failed=1
            fi
          done < <(git ls-files -z)
          exit $failed

      - name: Gitleaks scan
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --volume "$GITHUB_WORKSPACE:/repo:ro" \
            --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            detect --source . --config gitleaks.toml --redact --no-banner

  go:
    name: Go checks
    runs-on: ubuntu-latest
    env:
      # Force module mode and refuse to mutate go.mod / go.sum during CI.
      GOFLAGS: -mod=readonly
      GOTOOLCHAIN: local
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          # Pin the Go toolchain to whatever go.mod declares so CI cannot
          # silently drift to an unpinned "stable" version.
          go-version-file: go.mod
          check-latest: false
          cache: true

      - name: Verify module integrity
        run: |
          go mod download
          go mod verify

      - name: gofmt
        run: |
          unformatted="$(gofmt -s -l . | grep -v '^vendor/' || true)"
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt -s clean:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -count=1 ./...

      - name: Install govulncheck
        # Pin security tools so CI never installs an unreviewed @latest.
        run: go install golang.org/x/vuln/cmd/govulncheck@v1.3.0

      - name: govulncheck
        run: govulncheck ./...

      - name: Install gosec
        run: go install github.com/securego/gosec/v2/cmd/gosec@v2.22.0

      - name: gosec
        run: gosec ./...
